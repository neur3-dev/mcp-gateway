# config.yaml — gateway configuration
gateway:
  port: 3000
  host: "0.0.0.0"
  transport: "sse"
  # TLS is not handled by the gateway. Terminate TLS at a reverse proxy (nginx, Caddy).
  # cors_origins: restrict CORS to specific origins in production. Omit to allow all (dev default).
  # cors_origins:
  #   - "https://app.example.com"

auth:
  api_key_header: "X-API-Key"
  bcrypt_rounds: 12

rate_limit:
  default_rps: 10
  burst: 20
  per_server_rps: 50

servers:
  - name: "sqlite"
    transport: "stdio"
    command: "uvx"
    args: ["mcp-server-sqlite", "--db-path", "/data/app.db"]
    env: {}

  - name: "github"
    transport: "sse"
    url: "https://api.githubcopilot.com/mcp/"
    headers:
      Authorization: "Bearer ${GITHUB_TOKEN}"

circuit_breaker:
  failure_threshold: 5
  reset_timeout_ms: 30000

audit:
  enabled: true
  redact_args: true   # store SHA-256 hash of args; set false only for debug (stores truncated raw JSON)
  postgres_url: "${DATABASE_URL}"

# Optional — enables Redis-backed rate limiting and circuit breaker state.
# Falls back to in-memory if omitted or if Redis is unreachable (when fail_closed is false).
redis:
  url: "${REDIS_URL}"
  # fail_closed: true — deny requests when Redis is unreachable instead of silently falling back
  # to in-memory rate limiting. Recommended for production. Default: false (safe for dev/self-hosted).
  fail_closed: false
